<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大伟的太空补给站</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- 标题区域 -->
    <header class="header">
      <div class="logo">🚀</div>
      <h1 class="title">大伟的太空补给站</h1>
      <p class="subtitle">常用工具一键直达</p>
    </header>

    <!-- 分类标签 -->
    <nav class="category-nav">
      <button class="category-btn active" data-category="all">全部</button>
      <button class="category-btn" data-category="system">🛠️ 系统工具</button>
      <button class="category-btn" data-category="dev">💻 开发工具</button>
      <button class="category-btn" data-category="office">📄 办公软件</button>
    </nav>

    <!-- 工具卡片 -->
    <main class="tools-grid" id="toolsGrid">
      <!-- 由 JS 动态渲染 -->
    </main>

    <!-- 页脚 -->
    <footer class="footer">
      <p>Made with ❤️ by 大伟</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
